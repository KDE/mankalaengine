Options:
  setup-x-environment: False
  setup-dbus-session: False
  require-passing-tests-on: [ 'Linux', 'FreeBSD', 'Windows' ]
  run-cppcheck: True
  cppcheck-arguments: '--check-level=exhaustive --enable=warning,style,performance'
